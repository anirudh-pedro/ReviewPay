services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: revivepay
      POSTGRES_USER: revivepay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revivepay -d revivepay"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  api:
    build: .
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://revivepay:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/revivepay
      AUTH_MODE: api_key
      API_KEY: ${API_KEY:?set API_KEY}
      EXECUTION_MODE: enqueue
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8080}
    command: ["sh", "-c", "python scripts/migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["python", "scripts/run_worker.py"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://revivepay:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/revivepay
      AUTH_MODE: api_key
      API_KEY: ${API_KEY:?set API_KEY}
      EXECUTION_MODE: enqueue
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
